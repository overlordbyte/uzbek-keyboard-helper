name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish src/UzbekKeyboardHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "O'zbek Keyboard Helper ${{ github.ref_name }}"
          files: publish/UzbekKeyboardHelper.exe
          generate_release_notes: true
